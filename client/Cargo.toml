[package]
name = "commoncrawl"
version = "0.1.0"
edition = "2024"
description = "DuckDB extension which runs queries in the frozenlake-commoncrawl lambdas, split over many lambdas"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same duckdb-rs as the lambda. The C API extension works with every DuckDB since v1.2.0.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", rev = "e1b0940dfddd575c43fe4e2f070d47ee53d419cd", default-features = false, features = ["loadable-extension", "vtab-arrow"] }
arrow-ipc = { version = "60", features = ["zstd"] }
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rsa = "0.9"
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
